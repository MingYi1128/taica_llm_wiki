<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>演算法入門簡報</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d2330;--mut:#5c6475;--card:#fff;--line:#d9d6cc;--acc:#2f5fd0;--hi:#e8f0ff;--warn:#fff3d6;--warnfg:#7a5200}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8eaf0;--mut:#9aa3b5;--card:#1a1f2a;--line:#2d3444;--acc:#7da2ff;--hi:#1d2a4a;--warn:#3a2f12;--warnfg:#f2d48a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow:hidden}
.slide{display:none;height:100vh;padding:5vh 8vw 9vh;overflow:auto;max-width:1100px;margin:auto}
.slide.on{display:block}
h1{font-size:clamp(34px,6vw,60px);margin:12vh 0 8px}h2{font-size:clamp(24px,3.6vw,38px);margin:0 0 .6em;color:var(--acc)}h3{margin:.2em 0}
.sub{font-size:1.3em;color:var(--mut)}.meta,.note{color:var(--mut);font-size:.85em}
.warn{background:var(--warn);color:var(--warnfg);padding:.6em .9em;border-radius:8px;font-size:.9em}
.quote{font-size:1.25em;border-left:4px solid var(--acc);padding-left:.8em}
table{border-collapse:collapse;width:100%;margin:.6em 0}th,td{border:1px solid var(--line);padding:.4em .7em;text-align:left}th{background:var(--hi)}
pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.8em;font:15px/1.5 "JetBrains Mono",monospace;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1em}.card.hi{background:var(--hi);border-color:var(--acc)}.big{font-size:1.5em;font-weight:700;margin:.3em 0}
.tr{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}.tr em{color:var(--mut);font-size:.8em;margin-left:8px}
.cell{display:inline-block;min-width:2.1em;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:.1em .3em;font-family:"JetBrains Mono",monospace}
.cell.dim{opacity:.6}.cell.lo{background:var(--hi);border-color:var(--acc)}.cell.mid{background:var(--acc);color:var(--bg);font-weight:700}.cell.out{opacity:.25}
.ctl{margin:.8em 0}button{font:inherit;padding:.4em 1em;border-radius:8px;border:1px solid var(--acc);background:var(--card);color:var(--fg);cursor:pointer}button:disabled{opacity:.4}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6em .9em;margin:.5em 0}summary{cursor:pointer;font-weight:600}
footer{position:fixed;left:0;right:0;bottom:0;padding:.5em 1.2em;color:var(--mut);font-size:.75em;display:flex;justify-content:space-between;background:var(--bg)}
#nav{position:fixed;right:1em;bottom:2.4em;display:flex;gap:6px;z-index:2}
</style>
</head>
<body>
<!--SLIDES-->
<div id="nav"><button id="p" aria-label="上一張">‹</button><span id="cnt" style="align-self:center"></span><button id="n" aria-label="下一張">›</button></div>
<script>
/*DATA*/
const S=[...document.querySelectorAll('.slide')];let cur=0;
function show(k){cur=Math.max(0,Math.min(S.length-1,k));S.forEach((s,i)=>s.classList.toggle('on',i===cur));
 document.getElementById('cnt').textContent=(cur+1)+' / '+S.length;try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
document.getElementById('p').onclick=()=>show(cur-1);document.getElementById('n').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')show(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1)});
show((parseInt(location.hash.slice(1))||1)-1);
// binary search stepper (steps precomputed by Python)
(function(){const el=document.getElementById('bs');if(!el)return;let k=0;const T=DATA.bs_steps,a=DATA.bs_arr;
 function render(){const st=k>0?T[k-1]:null;
  el.innerHTML='<div class="tr">'+a.map((v,i)=>{const p=i+1;let c='cell';if(st){if(p===st.j)c+=' mid';else if(p>=st.i&&p<=st.m)c+=' lo';else c+=' out'}return '<span class="'+c+'">'+v+'</span>'}).join('')+'</div>';
  document.getElementById('bsmsg').textContent=k===0?'目標 X = '+DATA.bs_x+'。按「下一步」開始。':
   '第 '+k+' 次比較：i='+st.i+', m='+st.m+', j=⌊(i+m)/2⌋='+st.j+'，a_j='+st.aj+(st.aj===DATA.bs_x?' = X，找到了（位置 '+DATA.bs_res+'）':(DATA.bs_x<st.aj?' > X，往左半找':' < X，往右半找'));
  document.getElementById('prev').disabled=k===0;document.getElementById('next').disabled=k===T.length}
 document.getElementById('prev').onclick=()=>{k--;render()};document.getElementById('next').onclick=()=>{k++;render()};render()})();
</script>
</body>
</html>
